# Pipeline B - deterministic PR quality gate for JavaScript / TypeScript.
# Copy to .github/workflows/qa.yml, together with the qa/ directory and
# .qa/policy.json (start from examples/policies/javascript-typescript.json).
#
# Properties that make this a trustworthy gate:
#   * trigger is pull_request (never pull_request_target); token is read-only
#   * no AI step, no API keys, no auto-fix: the same inputs always give the same verdict
#   * the orchestrator scrubs secrets from the environment of every check it runs
#   * pin every action below to a reviewed full commit SHA before production use
name: QA gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: aqa-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  deterministic-qa:
    name: deterministic-qa          # the ONE status check to require in branch protection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0            # the merge-base must be reachable
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # interpreter for the orchestrator itself
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # OPTIONAL SCANNERS (gitleaks, semgrep, ...): install pinned, checksum-verified
      # versions here. While a scanner is not installed its check is SKIPPED and the
      # report says so; once installed it is enforced. To make a category mandatory, set
      # "required_categories" and "required": true in .qa/policy.json (reviewed by CODEOWNERS).

      - name: Deterministic QA (no AI, no secrets, no auto-fix)
        env:
          AQA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Base policy + base runner; the PR cannot edit the engine that judges it.
          AQA_POLICY_SOURCE: base
        run: |
          set -euo pipefail
          if ! git cat-file -e "$AQA_BASE_SHA:qa/aqa.py" 2>/dev/null; then
            echo "INCOMPLETE: trusted QA runner missing from base; bootstrap requires an owner-reviewed merge" >&2
            exit 3
          fi
          RUNNER_ROOT="$(mktemp -d)"
          trap 'rm -rf "$RUNNER_ROOT"' EXIT
          git archive "$AQA_BASE_SHA" qa | tar -x -C "$RUNNER_ROOT"
          python "$RUNNER_ROOT/qa/aqa.py" ci \
            --repo "$GITHUB_WORKSPACE" \
            --base "$AQA_BASE_SHA" \
            --policy .qa/policy.json \
            --policy-source "$AQA_POLICY_SOURCE" \
            --out .qa/out

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aqa-evidence
          path: .qa/out/
          if-no-files-found: warn
          retention-days: 14
