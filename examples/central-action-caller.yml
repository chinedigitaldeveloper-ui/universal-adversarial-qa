# Copy to .github/workflows/qa.yml of an adopter repository.
# Publish this template repository first as YOUR_ORG/engineering-standards.
# Replace REVIEWED_FULL_COMMIT_SHA with a reviewed 40-character commit SHA.
name: Central Adversarial QA
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      # Insert repo-specific SDK/dependency install steps here, no API secrets.
      - uses: YOUR_ORG/engineering-standards@REVIEWED_FULL_COMMIT_SHA
        with:
          base: ${{ github.event.pull_request.base.sha }}
          policy: .qa/policy.json
          policy-source: base   # use 'worktree' only for the PR that introduces the policy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: qa-evidence
          path: .qa/out/
          if-no-files-found: warn
